<!DOCTYPE html>
<html lang="en" data-app="light" data-md="github">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDFORGE — Markdown Converter</title>
<style>
/* ══════════════════════════════════════════
   MDFORGE — STYLESHEET
   ══════════════════════════════════════════ */

/* ── VARIABLES ───────────────────────────── */
:root {
  --app-bg:      #f1f3f5;
  --app-surface: #ffffff;
  --app-border:  #dee2e6;
  --app-text:    #212529;
  --app-text2:   #6c757d;
  --app-accent:  #4f46e5;
  --app-accent2: #4338ca;
  --app-danger:  #dc3545;
  --app-success: #198754;
  --app-shadow:  rgba(0,0,0,.08);
  --toolbar-h:   48px;
  --tabbar-h:    0px;
  --statusbar-h: 28px;
  --gutter-w:    5px;
  --font-ui:     -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:   'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  --radius:      6px;
  --radius-sm:   4px;
  --transition:  .15s ease;
}
[data-app="dark"] {
  --app-bg:      #0f1117;
  --app-surface: #1a1d27;
  --app-border:  #2d3142;
  --app-text:    #e8eaf6;
  --app-text2:   #9095a8;
  --app-shadow:  rgba(0,0,0,.3);
}

/* ── RESET ──────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font-ui); background: var(--app-bg); color: var(--app-text); font-size: 14px; }
button { cursor: pointer; font-family: inherit; }
a { color: inherit; }
input, select, textarea { font-family: inherit; }

/* ── SCROLLBAR ──────────────────────────── */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--app-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--app-text2); }

/* ── TOOLBAR ────────────────────────────── */
.toolbar {
  height: var(--toolbar-h);
  background: var(--app-surface);
  border-bottom: 1px solid var(--app-border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  box-shadow: 0 1px 3px var(--app-shadow);
  z-index: 100;
  position: relative;
  flex-shrink: 0;
}
.app-brand {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-right: 8px;
}
.app-logo-icon {
  width: 26px;
  height: 26px;
  background: var(--app-accent);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -1px;
  flex-shrink: 0;
  user-select: none;
}
.app-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.3px;
  color: var(--app-text);
}
.toolbar-sep {
  width: 1px;
  height: 24px;
  background: var(--app-border);
  margin: 0 4px;
  flex-shrink: 0;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 4px;
}
.toolbar-spacer { flex: 1; }

/* ── BUTTONS ────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border: 1px solid var(--app-border);
  border-radius: var(--radius-sm);
  background: var(--app-surface);
  color: var(--app-text);
  font-size: 12px;
  font-weight: 500;
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
  outline: none;
  height: 30px;
}
.btn:hover { border-color: var(--app-text2); background: var(--app-bg); }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--app-accent);
  border-color: var(--app-accent);
  color: #fff;
}
.btn-primary:hover { background: var(--app-accent2); border-color: var(--app-accent2); }
.btn-sm { padding: 3px 8px; height: 26px; font-size: 11px; }
.btn-icon { padding: 5px 8px; width: 30px; justify-content: center; }
.btn-danger { border-color: var(--app-danger); color: var(--app-danger); }
.btn-danger:hover { background: var(--app-danger); color: #fff; }

/* ── SELECT ─────────────────────────────── */
.select-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.select-label {
  font-size: 11px;
  color: var(--app-text2);
  margin-right: 5px;
  white-space: nowrap;
}
select.app-select {
  appearance: none;
  -webkit-appearance: none;
  background: var(--app-surface);
  border: 1px solid var(--app-border);
  color: var(--app-text);
  padding: 4px 24px 4px 9px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  height: 30px;
  outline: none;
  transition: border-color var(--transition);
}
select.app-select:hover, select.app-select:focus { border-color: var(--app-accent); }
.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 8px;
  font-size: 10px;
  color: var(--app-text2);
  pointer-events: none;
}

/* ── TAB BAR (mobile) ───────────────────── */
.tab-bar {
  display: none;
  background: var(--app-surface);
  border-bottom: 1px solid var(--app-border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: none;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
  color: var(--app-text2);
  transition: all var(--transition);
  border-bottom: 2px solid transparent;
}
.tab-btn.active {
  color: var(--app-accent);
  border-bottom-color: var(--app-accent);
}

/* ── MAIN SPLIT PANE ────────────────────── */
.split-container {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - var(--toolbar-h) - var(--tabbar-h) - var(--statusbar-h));
}
.editor-pane, .preview-pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 200px;
}
.editor-pane { flex: 1; }
.preview-pane { flex: 1; background: var(--app-surface); }

/* ── PANE HEADERS ───────────────────────── */
.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  border-bottom: 1px solid var(--app-border);
  background: var(--app-surface);
  flex-shrink: 0;
  height: 34px;
}
.pane-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--app-text2);
  text-transform: uppercase;
}
.pane-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── GUTTER (resizer) ───────────────────── */
.gutter {
  width: var(--gutter-w);
  background: var(--app-border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background var(--transition);
  position: relative;
}
.gutter:hover, .gutter.dragging { background: var(--app-accent); }
.gutter::after {
  content: '⋮';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 14px;
  color: var(--app-text2);
  opacity: .5;
  line-height: 1;
}

/* ── EDITOR ─────────────────────────────── */
#editor {
  flex: 1;
  width: 100%;
  padding: 18px 20px;
  background: #1e1e2e;
  color: #cdd6f4;
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.7;
  border: none;
  outline: none;
  resize: none;
  tab-size: 2;
  -moz-tab-size: 2;
  caret-color: #cba6f7;
}
#editor::placeholder { color: #585b70; }
[data-app="light"] #editor {
  background: #282c34;
  color: #abb2bf;
  caret-color: #61afef;
}
[data-app="light"] #editor::placeholder { color: #5c6370; }

/* ── PREVIEW SCROLL ─────────────────────── */
.preview-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ── PREVIEW BODY — BASE ────────────────── */
.preview-body {
  padding: 40px 48px;
  min-height: 100%;
  word-break: break-word;
  overflow-wrap: break-word;
}
@media (max-width: 900px) {
  .preview-body { padding: 24px 20px; }
}

/* ══════════════════════════════════════════
   PREVIEW THEMES
   ══════════════════════════════════════════ */

/* ── GITHUB THEME ───────────────────────── */
[data-md="github"] .preview-body {
  --c-bg:     #ffffff;
  --c-text:   #24292f;
  --c-head:   #24292f;
  --c-link:   #0969da;
  --c-border: #d0d7de;
  --c-bg2:    #f6f8fa;
  --c-text2:  #57606a;
  --c-pre:    #f6f8fa;
  --c-code:   #24292f;
  --c-hr:     #d8dee4;
  background: var(--c-bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Noto Sans, Helvetica, Arial, sans-serif;
  font-size: 16px;
  color: var(--c-text);
  line-height: 1.6;
  max-width: 800px;
  margin: 0 auto;
}

/* ── DARK THEME ─────────────────────────── */
[data-md="dark"] .preview-body {
  --c-bg:     #1e1e2e;
  --c-text:   #cdd6f4;
  --c-head:   #cba6f7;
  --c-link:   #89b4fa;
  --c-border: #313244;
  --c-bg2:    #181825;
  --c-text2:  #a6adc8;
  --c-pre:    #11111b;
  --c-code:   #cdd6f4;
  --c-hr:     #45475a;
  background: var(--c-bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 16px;
  color: var(--c-text);
  line-height: 1.6;
  max-width: 800px;
  margin: 0 auto;
}

/* ── SEPIA THEME ────────────────────────── */
[data-md="sepia"] .preview-body {
  --c-bg:     #f8f2e4;
  --c-text:   #3c3225;
  --c-head:   #2c2416;
  --c-link:   #8b4513;
  --c-border: #d4c5a9;
  --c-bg2:    #ede4d0;
  --c-text2:  #7a6a55;
  --c-pre:    #ede4d0;
  --c-code:   #5c3d1e;
  --c-hr:     #c9b99a;
  background: var(--c-bg);
  font-family: Georgia, 'Times New Roman', 'Book Antiqua', Palatino, serif;
  font-size: 17px;
  color: var(--c-text);
  line-height: 1.75;
  max-width: 720px;
  margin: 0 auto;
}

/* ── TERMINAL THEME ─────────────────────── */
[data-md="terminal"] .preview-body {
  --c-bg:     #050505;
  --c-text:   #00ff41;
  --c-head:   #00ff41;
  --c-link:   #00cc33;
  --c-border: #004d14;
  --c-bg2:    #0a0f0a;
  --c-text2:  #009922;
  --c-pre:    #0a0f0a;
  --c-code:   #00ff41;
  --c-hr:     #004d14;
  background: var(--c-bg);
  font-family: 'Courier New', 'Lucida Console', Consolas, monospace;
  font-size: 14px;
  color: var(--c-text);
  line-height: 1.7;
  max-width: none;
  text-shadow: 0 0 4px rgba(0,255,65,.25);
}

/* ── ACADEMIC THEME ─────────────────────── */
[data-md="academic"] .preview-body {
  --c-bg:     #fffef9;
  --c-text:   #1a1a1a;
  --c-head:   #000000;
  --c-link:   #00008b;
  --c-border: #cccccc;
  --c-bg2:    #f5f5f5;
  --c-text2:  #555555;
  --c-pre:    #f0f0f0;
  --c-code:   #333333;
  --c-hr:     #999999;
  background: var(--c-bg);
  font-family: 'Latin Modern', 'Computer Modern', Georgia, 'Times New Roman', serif;
  font-size: 16px;
  color: var(--c-text);
  line-height: 1.8;
  max-width: 700px;
  margin: 0 auto;
}

/* ══════════════════════════════════════════
   PREVIEW TYPOGRAPHY (shared, uses vars)
   ══════════════════════════════════════════ */
.preview-body h1,.preview-body h2,.preview-body h3,
.preview-body h4,.preview-body h5,.preview-body h6 {
  color: var(--c-head);
  margin: 1.4em 0 .6em;
  line-height: 1.3;
  font-weight: 700;
}
.preview-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--c-border); margin-top: .5em; }
.preview-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--c-border); }
.preview-body h3 { font-size: 1.25em; }
.preview-body h4 { font-size: 1em; }
.preview-body h5 { font-size: .875em; }
.preview-body h6 { font-size: .85em; color: var(--c-text2); }
.preview-body p { margin: 0 0 1em; }
.preview-body a { color: var(--c-link); text-decoration: underline; text-underline-offset: 2px; }
.preview-body a:hover { opacity: .8; }
.preview-body strong { font-weight: 700; color: var(--c-head); }
.preview-body em { font-style: italic; }
.preview-body del { text-decoration: line-through; color: var(--c-text2); }
.preview-body hr { border: none; border-top: 1px solid var(--c-hr); margin: 1.5em 0; }
.preview-body img { max-width: 100%; height: auto; border-radius: 4px; }
.preview-body blockquote {
  margin: 1em 0;
  padding: .5em 1em;
  border-left: 4px solid var(--c-link);
  background: var(--c-bg2);
  color: var(--c-text2);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.preview-body blockquote p { margin: 0; }
.preview-body ul, .preview-body ol { padding-left: 2em; margin: 0 0 1em; }
.preview-body li { margin: .25em 0; line-height: 1.6; }
.preview-body li > ul, .preview-body li > ol { margin: .25em 0; }

/* Tables */
.preview-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
  overflow: auto;
  display: block;
  font-size: .92em;
}
.preview-body th {
  background: var(--c-bg2);
  color: var(--c-text);
  font-weight: 600;
  padding: 8px 13px;
  border: 1px solid var(--c-border);
  text-align: left;
}
.preview-body td {
  padding: 7px 13px;
  border: 1px solid var(--c-border);
  vertical-align: top;
}
.preview-body tr:nth-child(even) td { background: var(--c-bg2); }

/* Inline code */
.preview-body :not(pre) > code {
  background: var(--c-bg2);
  color: var(--c-code);
  padding: .2em .45em;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: .88em;
  border: 1px solid var(--c-border);
}

/* Code blocks */
.preview-body pre {
  background: var(--c-pre);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: 16px 18px;
  overflow-x: auto;
  margin: 1em 0;
  position: relative;
}
.preview-body pre code {
  background: none !important;
  border: none !important;
  padding: 0 !important;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  color: var(--c-code);
}
.preview-body .code-block-wrap {
  position: relative;
}
.preview-body .code-lang-badge {
  position: absolute;
  top: 8px;
  right: 40px;
  font-size: 10px;
  color: var(--c-text2);
  letter-spacing: .5px;
  text-transform: uppercase;
  font-family: var(--font-mono);
  user-select: none;
}
.preview-body .code-copy-btn {
  position: absolute;
  top: 6px;
  right: 8px;
  background: var(--c-bg2);
  border: 1px solid var(--c-border);
  color: var(--c-text2);
  border-radius: var(--radius-sm);
  padding: 2px 7px;
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font-ui);
  transition: all var(--transition);
  z-index: 1;
}
.preview-body .code-copy-btn:hover { color: var(--c-text); border-color: var(--c-text2); }

/* Task list */
.preview-body .task-list-item { list-style: none; margin-left: -1.5em; }
.preview-body .task-list-item input[type="checkbox"] {
  margin-right: .5em;
  accent-color: var(--c-link);
  width: 14px;
  height: 14px;
}

/* Footnotes */
.preview-body .footnotes {
  margin-top: 2em;
  padding-top: 1em;
  border-top: 1px solid var(--c-border);
  font-size: .88em;
  color: var(--c-text2);
}

/* ── SYNTAX HIGHLIGHTING TOKENS ─────────── */
.hl-kw  { color: #c792ea; } /* keywords */
.hl-kw2 { color: #f78c6c; } /* type keywords */
.hl-str { color: #c3e88d; } /* strings */
.hl-cmt { color: #546e7a; font-style: italic; } /* comments */
.hl-num { color: #f78c6c; } /* numbers */
.hl-fn  { color: #82aaff; } /* function names */
.hl-op  { color: #89ddff; } /* operators */
.hl-cls { color: #ffcb6b; } /* class/type names */
.hl-atr { color: #f07178; } /* attributes */
.hl-var { color: #eeffff; } /* identifiers */
.hl-pun { color: #89ddff; } /* punctuation */
.hl-tag { color: #f07178; } /* html tags */
.hl-at  { color: #89ddff; } /* html attributes */
.hl-val { color: #c3e88d; } /* html attribute values */
.hl-ent { color: #f78c6c; } /* html entities */
.hl-sel { color: #c792ea; } /* css selector */
.hl-pro { color: #82aaff; } /* css property */
.hl-cval{ color: #c3e88d; } /* css value */

/* Light/GitHub theme overrides for syntax tokens */
[data-md="github"] .hl-kw,
[data-md="sepia"]  .hl-kw,
[data-md="academic"] .hl-kw { color: #d73a49; }
[data-md="github"] .hl-str,
[data-md="sepia"]  .hl-str,
[data-md="academic"] .hl-str { color: #032f62; }
[data-md="github"] .hl-cmt,
[data-md="sepia"]  .hl-cmt,
[data-md="academic"] .hl-cmt { color: #6a737d; }
[data-md="github"] .hl-num,
[data-md="sepia"]  .hl-num,
[data-md="academic"] .hl-num { color: #005cc5; }
[data-md="github"] .hl-fn,
[data-md="sepia"]  .hl-fn,
[data-md="academic"] .hl-fn { color: #6f42c1; }
[data-md="github"] .hl-cls,
[data-md="sepia"]  .hl-cls,
[data-md="academic"] .hl-cls { color: #e36209; }
[data-md="github"] .hl-tag,
[data-md="sepia"]  .hl-tag,
[data-md="academic"] .hl-tag { color: #22863a; }
[data-md="github"] .hl-atr,
[data-md="sepia"]  .hl-atr,
[data-md="academic"] .hl-atr { color: #005cc5; }

/* Terminal theme tokens */
[data-md="terminal"] .hl-kw  { color: #00ff41; font-weight: bold; }
[data-md="terminal"] .hl-str { color: #00cc33; }
[data-md="terminal"] .hl-cmt { color: #009922; font-style: italic; }
[data-md="terminal"] .hl-num { color: #ffb000; }
[data-md="terminal"] .hl-fn  { color: #00ff99; }
[data-md="terminal"] .hl-cls { color: #ffb000; }

/* ── STATUS BAR ─────────────────────────── */
.status-bar {
  height: var(--statusbar-h);
  background: var(--app-surface);
  border-top: 1px solid var(--app-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-size: 11px;
  color: var(--app-text2);
  flex-shrink: 0;
}
.status-left, .status-right { display: flex; align-items: center; gap: 8px; }
.stat-sep { opacity: .4; }
#status-msg { transition: color var(--transition); }
#status-msg.ok { color: var(--app-success); }
#status-msg.err { color: var(--app-danger); }

/* ── TOAST ──────────────────────────────── */
.toast {
  position: fixed;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a2e;
  color: #fff;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  opacity: 0;
  transition: all .3s ease;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── LOADING OVERLAY ────────────────────── */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 900;
  backdrop-filter: blur(3px);
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,.2);
  border-top-color: var(--app-accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #fff; font-size: 14px; font-weight: 500; }

/* ── MODAL ──────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 800;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--app-surface);
  border: 1px solid var(--app-border);
  border-radius: var(--radius);
  min-width: 340px;
  max-width: 560px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  overflow: hidden;
}
.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--app-border);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-body { padding: 18px; }
.modal-footer {
  padding: 12px 18px;
  border-top: 1px solid var(--app-border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.modal-x { background: none; border: none; color: var(--app-text2); font-size: 18px; cursor: pointer; padding: 0; line-height: 1; }
.modal-x:hover { color: var(--app-danger); }

/* ── SETTINGS PANEL ─────────────────────── */
.settings-panel {
  position: fixed;
  top: var(--toolbar-h);
  right: 0;
  width: 300px;
  height: calc(100vh - var(--toolbar-h));
  background: var(--app-surface);
  border-left: 1px solid var(--app-border);
  z-index: 200;
  transform: translateX(100%);
  transition: transform .25s ease;
  overflow-y: auto;
  padding: 16px;
  box-shadow: -4px 0 20px var(--app-shadow);
}
.settings-panel.open { transform: translateX(0); }
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--app-border);
}
.setting-label { font-size: 13px; font-weight: 500; }
.setting-desc { font-size: 11px; color: var(--app-text2); margin-top: 2px; }

/* ── MOBILE RESPONSIVE ──────────────────── */
@media (max-width: 768px) {
  :root { --tabbar-h: 40px; }
  .tab-bar { display: flex; }
  .toolbar-group.hide-mobile,
  .toolbar-sep.hide-mobile,
  .select-label { display: none; }
  .gutter { display: none; }
  .editor-pane, .preview-pane {
    position: absolute;
    inset: 0;
    flex: unset;
    width: 100%;
    min-width: unset;
    transition: opacity var(--transition);
  }
  .editor-pane.hidden-mobile,
  .preview-pane.hidden-mobile { opacity: 0; pointer-events: none; z-index: 0; }
  .editor-pane { z-index: 1; }
  .preview-pane { z-index: 1; }
  .app-name { display: none; }
  .split-container { position: relative; }
  .btn-sm-hide { display: none; }
}

/* ── PRINT (for PDF print-fallback) ─────── */
@media print {
  .toolbar, .tab-bar, .gutter, .status-bar,
  .editor-pane, .pane-header, .toast,
  .loading-overlay { display: none !important; }
  .preview-pane { flex: 1; }
  .preview-body { padding: 0; max-width: 100%; }
}

/* ── FULLSCREEN PREVIEW ─────────────────── */
.preview-pane.fullscreen {
  position: fixed;
  inset: 0;
  z-index: 500;
  max-width: none;
}
.preview-pane.fullscreen .pane-header { position: sticky; top: 0; z-index: 1; }
.preview-pane.fullscreen .preview-scroll { height: calc(100vh - 34px); }

/* ── FONT SIZE RANGE ────────────────────── */
.preview-body.fs-sm { font-size: 13px !important; }
.preview-body.fs-md { font-size: 16px !important; }
.preview-body.fs-lg { font-size: 19px !important; }
.preview-body.fs-xl { font-size: 22px !important; }

/* ── DROP ZONE ──────────────────────────── */
body.drag-over::after {
  content: 'Drop .md file to import';
  position: fixed;
  inset: 0;
  background: rgba(79,70,229,.15);
  border: 3px dashed var(--app-accent);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 600;
  color: var(--app-accent);
}

/* ── INSTAGRAM CAROUSEL ─────────────────── */
#carousel-stage {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 1080px;
  z-index: -1;
  overflow: visible;
}
.carousel-slide {
  width: 1080px;
  height: 1080px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
  background: linear-gradient(150deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  color: #ffffff;
  padding: 100px 88px;
}
.carousel-slide[data-cs-bg="light"] {
  background: linear-gradient(150deg, #ffffff 0%, #f1f3f5 100%);
  color: #14141f;
}
.carousel-slide[data-cs-bg="punch"] {
  background: linear-gradient(150deg, #ff5f6d 0%, #ffc371 100%);
  color: #1a0e00;
}
.carousel-slide[data-cs-bg="mono"] {
  background: #0b0b0c;
  color: #f5f5f5;
}
.carousel-slide-content {
  font-size: 40px;
  line-height: 1.42;
  font-weight: 600;
  word-break: break-word;
}
.carousel-slide-content h1, .carousel-slide-content h2, .carousel-slide-content h3 {
  font-weight: 800;
  line-height: 1.18;
  margin: 0 0 .35em;
  letter-spacing: -.01em;
}
.carousel-slide-content h1 { font-size: 1.5em; }
.carousel-slide-content h2 { font-size: 1.3em; }
.carousel-slide-content h3 { font-size: 1.12em; }
.carousel-slide-content p { margin: 0 0 .5em; }
.carousel-slide-content strong { font-weight: 800; }
.carousel-slide-content em { font-style: italic; }
.carousel-slide-content ul, .carousel-slide-content ol { margin: 0 0 .5em; padding-left: 1.1em; }
.carousel-slide-content li { margin: .25em 0; }
.carousel-slide-content blockquote {
  margin: .5em 0;
  padding: .2em 0 .2em 28px;
  border-left: 6px solid currentColor;
  opacity: .92;
  font-style: italic;
}
.carousel-slide-content code {
  font-family: var(--font-mono);
  background: rgba(255,255,255,.14);
  padding: .12em .4em;
  border-radius: 6px;
  font-size: .78em;
}
.carousel-slide[data-cs-bg="light"] .carousel-slide-content code,
.carousel-slide[data-cs-bg="punch"] .carousel-slide-content code {
  background: rgba(0,0,0,.08);
}
.carousel-slide-content pre {
  background: rgba(0,0,0,.32);
  border-radius: 14px;
  padding: 26px 30px;
  margin: .4em 0;
  overflow: hidden;
}
.carousel-slide-content pre code {
  background: none;
  padding: 0;
  font-size: .55em;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.carousel-slide[data-cs-bg="light"] .carousel-slide-content pre { background: rgba(0,0,0,.06); }
.carousel-badge {
  position: absolute;
  top: 56px;
  right: 64px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: .04em;
  padding: 10px 22px;
  border-radius: 999px;
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(4px);
}
.carousel-slide[data-cs-bg="light"] .carousel-badge,
.carousel-slide[data-cs-bg="punch"] .carousel-badge { background: rgba(0,0,0,.1); }
.carousel-handle {
  position: absolute;
  bottom: 56px;
  left: 88px;
  font-size: 28px;
  font-weight: 700;
  opacity: .85;
  letter-spacing: .02em;
}
.carousel-progress-dots {
  position: absolute;
  bottom: 56px;
  right: 64px;
  display: flex;
  gap: 10px;
}
.carousel-progress-dots span {
  width: 12px; height: 12px; border-radius: 50%;
  background: rgba(255,255,255,.3);
}
.carousel-slide[data-cs-bg="light"] .carousel-progress-dots span,
.carousel-slide[data-cs-bg="punch"] .carousel-progress-dots span { background: rgba(0,0,0,.18); }
.carousel-progress-dots span.active { background: currentColor; }

/* Carousel options modal extras */
.cs-field { margin-bottom: 14px; }
.cs-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--app-text2); text-transform: uppercase; letter-spacing: .03em; }
.cs-field input[type="text"], .cs-field select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--app-border);
  border-radius: var(--radius-sm); background: var(--app-bg); color: var(--app-text); font-size: 13px;
}
.cs-swatches { display: flex; gap: 8px; }
.cs-swatch {
  width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
  border: 2px solid transparent; flex-shrink: 0;
}
.cs-swatch.selected { border-color: var(--app-accent); }
.cs-progress-wrap { display: none; align-items: center; gap: 10px; font-size: 12px; color: var(--app-text2); margin-top: 10px; }
.cs-progress-wrap.show { display: flex; }
.cs-progress-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--app-border); overflow: hidden; }
.cs-progress-fill { height: 100%; width: 0%; background: var(--app-accent); transition: width .2s ease; }

/* ── EXPORT PREVIEW ─────────────────────── */
#export-clone {
  position: fixed;
  left: -9999px;
  top: 0;
  overflow: visible;
  z-index: -1;
}
</style>

    sql:['SELECT','FROM','WHERE','JOIN','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','ON','AS','AND','OR','NOT','IN','EXISTS','BETWEEN','LIKE','IS','NULL','ORDER','BY','GROUP','HAVING','LIMIT','OFFSET','UNION','ALL','DISTINCT','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','DROP','INDEX','VIEW','PROCEDURE','FUNCTION','TRIGGER','DATABASE','SCHEMA','PRIMARY','KEY','FOREIGN','REFERENCES','UNIQUE','CHECK','DEFAULT','AUTO_INCREMENT','CONSTRAINT','WITH','CASE','WHEN','THEN','ELSE','END','COUNT','SUM','AVG','MIN','MAX','COALESCE','NULLIF','CAST','CONVERT'],
  };
  const ALIASES = {js:'javascript',ts:'typescript',jsx:'javascript',tsx:'typescript',py:'python',rb:'ruby',sh:'bash','c++':'cpp',cs:'csharp',c:'cpp',cpp:'cpp',rs:'rust'};

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // NOTE: these used to be chains of global regex .replace() calls run one
  // after another on the *same* string. That has two fatal problems: (1)
  // each later regex re-scans HTML the earlier ones already inserted (e.g.
  // the ":" / value regex would match colons inside a `class="hl-sel"`
  // attribute it had just written), producing mangled/nested markup, and
  // (2) the caller pre-escaped quotes to `&quot;` before these ran, so the
  // regexes looking for literal `"` / `'` never matched anything, silently
  // dropping attribute-value and string highlighting. Both are rewritten
  // below as single-pass scanners that escape as they go, operating only on
  // the original raw source text.
  function highlightCSSValue(val){
    let out = '<span class="hl-cval">', i = 0;
    const len = val.length;
    while(i < len){
      if(val[i]==='"'||val[i]==="'"){
        const q=val[i]; let j=i+1, s=q;
        while(j<len){
          if(val[j]==='\\'){ s+=val[j]+(val[j+1]||''); j+=2; continue; }
          if(val[j]===q){ s+=q; j++; break; }
          s+=val[j++];
        }
        out += esc(s); i=j; continue;
      }
      if(/[#0-9]/.test(val[i])){
        let j=i; while(j<len && /[#0-9a-fA-F.%a-zA-Z]/.test(val[j])) j++;
        out += esc(val.slice(i,j)); i=j; continue;
      }
      out += esc(val[i++]);
    }
    return out+'</span>';
  }

  function highlightCSS(code){
    let out = '', i = 0;
    const len = code.length;
    while(i < len){
      if(code[i]==='/' && code[i+1]==='*'){
        const end = code.indexOf('*/', i+2);
        const chunk = end<0 ? code.slice(i) : code.slice(i, end+2);
        out += '<span class="hl-cmt">'+esc(chunk)+'</span>';
        i += chunk.length; continue;
      }
      if(/[.#\w-]/.test(code[i])){
        let j=i; while(j<len && /[.#\w-]/.test(code[j])) j++;
        const word = code.slice(i,j);
        let k=j; while(k<len && /\s/.test(code[k])) k++;
        if(code[k]==='{'){ out += '<span class="hl-sel">'+esc(word)+'</span>'; i=j; continue; }
        if(code[k]===':'){ out += '<span class="hl-pro">'+esc(word)+'</span>'; i=j; continue; }
        out += esc(word); i=j; continue;
      }
      if(code[i]===':'){
        let j=i+1, val='';
        while(j<len && code[j]!==';' && code[j]!=='{' && code[j]!=='}'){ val+=code[j]; j++; }
        out += ':' + highlightCSSValue(val);
        i=j; continue;
      }
      out += esc(code[i++]);
    }
    return out;
  }

  function highlightHTML(code){
    // `code` here is the RAW (unescaped) source — this function does its
    // own escaping token-by-token so quote/angle-bracket characters are
    // only ever escaped once and attribute matching runs on real characters.
    let out = '', i = 0;
    const len = code.length;
    while(i < len){
      if(code.slice(i,i+4)==='<!--'){
        const end = code.indexOf('-->', i+4);
        const chunk = end<0 ? code.slice(i) : code.slice(i, end+3);
        out += '<span class="hl-cmt">'+esc(chunk)+'</span>';
        i += chunk.length; continue;
      }
      if(code[i]==='<'){
        let j = i+1;
        const closing = code[j]==='/';
        if(closing) j++;
        const tagStart = j;
        while(j<len && /[\w:-]/.test(code[j])) j++;
        const tagName = code.slice(tagStart,j);
        out += '&lt;'+(closing?'/':'')+(tagName ? '<span class="hl-tag">'+esc(tagName)+'</span>' : '');
        while(j<len && code[j]!=='>'){
          if(/[\w:-]/.test(code[j])){
            let k=j; while(k<len && /[\w:-]/.test(code[k])) k++;
            out += '<span class="hl-at">'+esc(code.slice(j,k))+'</span>';
            j=k;
            let m=j; while(m<len && /\s/.test(code[m])) m++;
            if(code[m]==='='){
              out += esc(code.slice(j,m))+'=';
              j=m+1;
              while(j<len && /\s/.test(code[j])){ out+=esc(code[j]); j++; }
              if(code[j]==='"'||code[j]==="'"){
                const q=code[j]; let s=q, n=j+1;
                while(n<len){ s+=code[n]; if(code[n]===q){ n++; break; } n++; }
                out += '<span class="hl-val">'+esc(s)+'</span>';
                j=n;
              }
            }
            continue;
          }
          out += esc(code[j]); j++;
        }
        if(code[j]==='>'){ out+='&gt;'; j++; }
        i=j; continue;
      }
      out += esc(code[i++]);
    }
    return out;
  }

  function tokenize(code, lang){
    const kws = new Set((KW[lang]||[]).map(k=>k.toLowerCase()));
    let out = '';
    let i = 0;
    const len = code.length;

    while(i < len){
      // Block comment
      if(code[i]==='/' && code[i+1]==='*'){
        const end = code.indexOf('*/', i+2);
        const chunk = end<0 ? code.slice(i) : code.slice(i, end+2);
        out += '<span class="hl-cmt">'+esc(chunk)+'</span>';
        i += chunk.length; continue;
      }
      // Python/Ruby/Bash line comment #
      if((lang==='python'||lang==='ruby'||lang==='bash')&&code[i]==='#'){
        const end = code.indexOf('\n', i);
        const chunk = end<0 ? code.slice(i) : code.slice(i,end);
        out += '<span class="hl-cmt">'+esc(chunk)+'</span>';
        i += chunk.length; continue;
      }
      // SQL comment --
      if(lang==='sql'&&code[i]==='-'&&code[i+1]==='-'){
        const end = code.indexOf('\n',i);
        const chunk = end<0?code.slice(i):code.slice(i,end);
        out+='<span class="hl-cmt">'+esc(chunk)+'</span>';
        i+=chunk.length; continue;
      }
      // Line comment //
      if(code[i]==='/'&&code[i+1]==='/'){
        const end=code.indexOf('\n',i);
        const chunk=end<0?code.slice(i):code.slice(i,end);
        out+='<span class="hl-cmt">'+esc(chunk)+'</span>';
        i+=chunk.length; continue;
      }
      // Template literal
      if(code[i]==='`'){
        let j=i+1, s='`';
        while(j<len){
          if(code[j]==='\\'){s+=code[j]+code[j+1];j+=2;continue;}
          if(code[j]==='`'){s+='`';j++;break;}
          s+=code[j++];
        }
        out+='<span class="hl-str">'+esc(s)+'</span>';
        i=j; continue;
      }
      // String " or '
      if(code[i]==='"'||code[i]==="'"){
        const q=code[i]; let j=i+1, s=q;
        while(j<len){
          if(code[j]==='\\'){s+=code[j]+code[j+1];j+=2;continue;}
          if(code[j]===q){s+=q;j++;break;}
          if(code[j]==='\n'){break;}
          s+=code[j++];
        }
        out+='<span class="hl-str">'+esc(s)+'</span>';
        i=j; continue;
      }
      // Python triple string
      if(lang==='python'&&(code.slice(i,i+3)==='"""'||code.slice(i,i+3)==="'''")){
        const q=code.slice(i,i+3); const end=code.indexOf(q,i+3);
        const chunk=end<0?code.slice(i):code.slice(i,end+3);
        out+='<span class="hl-str">'+esc(chunk)+'</span>';
        i+=chunk.length; continue;
      }
      // Number
      if(/[0-9]/.test(code[i]) || (code[i]==='.'&&/[0-9]/.test(code[i+1]||''))){
        let j=i, s='';
        if(code[j]==='0'&&(code[j+1]==='x'||code[j+1]==='X')){
          s+='0x'; j+=2;
          while(j<len&&/[0-9a-fA-F_]/.test(code[j])) s+=code[j++];
        } else {
          while(j<len&&/[0-9._]/.test(code[j])) s+=code[j++];
          if(j<len&&(code[j]==='e'||code[j]==='E')){
            s+=code[j++];
            if(code[j]==='+'||code[j]==='-') s+=code[j++];
            while(j<len&&/[0-9]/.test(code[j])) s+=code[j++];
          }
          if(j<len&&(code[j]==='f'||code[j]==='L'||code[j]==='n')) s+=code[j++];
        }
        out+='<span class="hl-num">'+esc(s)+'</span>';
        i=j; continue;
      }
      // Identifier / keyword
      if(/[a-zA-Z_$@]/.test(code[i])){
        let j=i, s='';
        while(j<len&&/[\w$]/.test(code[j])) s+=code[j++];
        const lower=s.toLowerCase();
        if(lang==='sql'?KW.sql.includes(s.toUpperCase()):kws.has(lower)){
          out+='<span class="hl-kw">'+esc(s)+'</span>';
        } else if(/^[A-Z][A-Z0-9_]+$/.test(s)&&s.length>1){
          out+='<span class="hl-cls">'+esc(s)+'</span>';
        } else if(/^[A-Z]/.test(s)&&lang!=='bash'){
          out+='<span class="hl-cls">'+esc(s)+'</span>';
        } else if(j<len&&(code[j]==='('||code.slice(j).match(/^\s*\(/))){
          out+='<span class="hl-fn">'+esc(s)+'</span>';
        } else {
          out+=esc(s);
        }
        i=j; continue;
      }
      // Operators
      if(/[+\-*/%=<>!&|^~?:]/.test(code[i])){
        out+='<span class="hl-op">'+esc(code[i])+'</span>';
        i++; continue;
      }
      out+=esc(code[i++]);
    }
    return out;
  }

  return {
    highlight(raw, lang=''){
      lang = ALIASES[lang.toLowerCase()] || lang.toLowerCase();
      const escaped = raw.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
      if(lang==='html'||lang==='xml') return highlightHTML(escaped);
      if(lang==='css'||lang==='scss'||lang==='sass') return highlightCSS(escaped);
      if(lang==='json'){
        return esc(escaped)
          .replace(/"((?:[^"\\]|\\.)*)"\s*:/g,'<span class="hl-at">"$1"</span>:')
          .replace(/:\s*"((?:[^"\\]|\\.)*)"/g,': <span class="hl-str">"$1"</span>')
          .replace(/:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,': <span class="hl-num">$1</span>')
          .replace(/:\s*(true|false|null)/g,': <span class="hl-kw">$1</span>');
      }
      if(KW[lang]||lang==='cpp') return tokenize(escaped, lang);
      // Generic: just escape
      return esc(escaped);
    }
  };
})();

// ── PDF WRITER (pure JS, image-based multi-page) ────────
const PDFWriter = (()=>{
  const A4W = 595.28, A4H = 841.89;
  const enc = new TextEncoder();

  function str(s){ return enc.encode(s); }

  function concatBytes(arrays){
    const total = arrays.reduce((n,a)=>n+a.length,0);
    const out = new Uint8Array(total);
    let off = 0;
    for(const a of arrays){ out.set(a,off); off+=a.length; }
    return out;
  }

  function canvasToJpeg(c){
    const d = c.toDataURL('image/jpeg',0.92);
    const b64 = d.split(',')[1];
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return bytes;
  }

  function splitCanvas(canvas){
    const pageH = Math.floor(canvas.width * (A4H/A4W));
    const pages = [];
    let y=0;
    while(y<canvas.height){
      const h = Math.min(pageH, canvas.height-y);
      const pc = document.createElement('canvas');
      pc.width = canvas.width;
      pc.height = pageH;
      const ctx = pc.getContext('2d');
      ctx.fillStyle='#ffffff';
      ctx.fillRect(0,0,canvas.width,pageH);
      ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      pages.push(pc);
      y+=pageH;
    }
    return pages;
  }

  async function generate(canvas, filename='document.pdf'){
    const pages = splitCanvas(canvas);
    const n = pages.length;
    const chunks = [];
    const offsets = {};
    let pos = 0;

    function push(data){
      const b = typeof data==='string' ? str(data) : data;
      chunks.push(b); pos+=b.length; return b.length;
    }
    function obj(id, content){
      offsets[id]=pos;
      push(`${id} 0 obj\n`);
      if(typeof content==='string') push(content);
      else push(content);
      push('\nendobj\n');
    }

    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

    // Catalog
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');

    // Pages
    const pageIds = Array.from({length:n},(_,i)=>3+i*3);
    obj(2,`<< /Type /Pages /Kids [${pageIds.map(id=>`${id} 0 R`).join(' ')}] /Count ${n} >>`);

    for(let i=0;i<n;i++){
      const jpegData = canvasToJpeg(pages[i]);
      const pw=pages[i].width, ph=pages[i].height;
      const pageId = 3+i*3;
      const contentId = pageId+1;
      const imgId = pageId+2;

      // Page object
      obj(pageId,
        `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4W} ${A4H}] `+
        `/Contents ${contentId} 0 R /Resources << /XObject << /Im${i} ${imgId} 0 R >> >> >>`
      );

      // Content stream
      const cs = `q ${A4W} 0 0 ${A4H} 0 0 cm /Im${i} Do Q`;
      obj(contentId, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);

      // Image XObject
      offsets[imgId]=pos;
      const dictStr = `${imgId} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegData.length} >>\nstream\n`;
      push(dictStr);
      push(jpegData);
      push('\nendstream\nendobj\n');
    }

    const totalObjs = 2 + n*3;
    const xrefPos = pos;
    push(`xref\n0 ${totalObjs+1}\n`);
    push('0000000000 65535 f \n');
    for(let i=1;i<=totalObjs;i++){
      push(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');
    }
    push(`trailer\n<< /Size ${totalObjs+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);

    const pdf = concatBytes(chunks);
    const blob = new Blob([pdf],{type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }

  return { generate };
})();

// ── MARKED.JS CONFIGURATION ──────────────────────────────
// NOTE: the bundled marked.js is v12.0.0, whose Renderer methods use plain
// positional string arguments — NOT the destructured-token object API that
// shipped in marked v13+. Using the wrong signature silently passes
// `undefined` into the highlighter / list body, which is what produced the
// "undefined" text bug. Keep these signatures in sync with whatever marked
// version is bundled by build_mdforge.py.
const renderer = new marked.Renderer();

// Custom code renderer with syntax highlighting + copy button
renderer.code = function(code, infostring, escaped){
  const validLang = (infostring || '').match(/\S*/)[0] || '';
  const highlighted = HL.highlight(code, validLang);
  const langBadge = validLang ? `<span class="code-lang-badge">${validLang}</span>` : '';
  const copyBtn = `<button class="code-copy-btn" onclick="copyCode(this)" data-code="${encodeURIComponent(code)}">Copy</button>`;
  return `<div class="code-block-wrap">
    ${langBadge}${copyBtn}
    <pre><code class="lang-${validLang}">${highlighted}</code></pre>
  </div>`;
};

// Custom checkbox/task-list renderer
renderer.listitem = function(text, task, checked){
  if(task){
    return `<li class="task-list-item">${text}</li>\n`;
  }
  return `<li>${text}</li>\n`;
};

marked.setOptions({
  renderer,
  gfm: true,
  breaks: false,
  pedantic: false,
});

// ── MAIN APP STATE ────────────────────────────────────────
const App = {
  filename: 'document',
  mdTheme: 'github',
  appDark: false,
  fontSize: 'fs-md',
  isFullscreen: false,
  parseDebounce: null,

  get editor(){ return document.getElementById('editor'); },
  get previewBody(){ return document.getElementById('preview-body'); },
};

// ── PARSE & RENDER ────────────────────────────────────────
function renderPreview(){
  const raw = App.editor.value;
  try {
    const html = marked.parse(raw);
    App.previewBody.innerHTML = html;
    // After render, make code copy buttons work
  } catch(e) {
    App.previewBody.innerHTML = '<p style="color:red;">Parse error: '+e.message+'</p>';
  }
  updateStats(raw);
  saveToStorage();
}

function scheduleRender(){
  clearTimeout(App.parseDebounce);
  App.parseDebounce = setTimeout(renderPreview, 120);
}

// ── STATS ─────────────────────────────────────────────────
function updateStats(text){
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const lines = text.split('\n').length;
  const mins = Math.max(1, Math.ceil(words / 200));
  document.getElementById('stat-words').textContent = words.toLocaleString()+' words';
  document.getElementById('stat-chars').textContent = chars.toLocaleString()+' chars';
  document.getElementById('stat-lines').textContent = lines.toLocaleString()+' lines';
  document.getElementById('stat-read').textContent = mins+' min read';
}

// ── THEMES ────────────────────────────────────────────────
function setPreviewTheme(theme){
  App.mdTheme = theme;
  document.documentElement.setAttribute('data-md', theme);
  document.getElementById('sel-theme').value = theme;
  document.getElementById('sel-theme-mobile').value = theme;
  document.getElementById('status-theme').textContent = theme.charAt(0).toUpperCase()+theme.slice(1);
  localStorage.setItem('mdforge-theme', theme);
}

function setAppDark(dark){
  App.appDark = dark;
  document.documentElement.setAttribute('data-app', dark?'dark':'light');
  localStorage.setItem('mdforge-dark', dark?'1':'0');
}

function setFontSize(fs){
  App.fontSize = fs;
  const pb = App.previewBody;
  pb.classList.remove('fs-sm','fs-md','fs-lg','fs-xl');
  pb.classList.add(fs);
  localStorage.setItem('mdforge-fs', fs);
}

// ── FILE IO ───────────────────────────────────────────────
function openFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    App.editor.value = e.target.result;
    App.filename = file.name.replace(/\.[^.]+$/,'');
    document.getElementById('pane-filename').textContent = file.name;
    renderPreview();
    toast('Loaded: '+file.name);
  };
  reader.readAsText(file);
}

function saveMarkdown(){
  const blob = new Blob([App.editor.value],{type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=(App.filename||'document')+'.md';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Saved as '+(App.filename||'document')+'.md');
}

function copyHTML(){
  const html = marked.parse(App.editor.value);
  navigator.clipboard.writeText(html).then(()=>toast('HTML copied to clipboard')).catch(()=>toast('Copy failed'));
}

// ── CODE COPY ─────────────────────────────────────────────
window.copyCode = function(btn){
  const code = decodeURIComponent(btn.getAttribute('data-code'));
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent='Copied!';
    setTimeout(()=>btn.textContent='Copy',1500);
  });
};

// ── EXPORT: BUILD EXPORT CANVAS ───────────────────────────
async function buildExportCanvas(scale=2, useForeignObject=false){
  const clone = document.getElementById('export-clone');
  // Build a clean export div
  const wrap = document.createElement('div');
  wrap.style.cssText = `
    width: 800px;
    position: absolute;
    left: -9999px;
    top: 0;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 60px 72px;
    box-sizing: border-box;
  `;
  // Apply theme class
  wrap.setAttribute('data-md', App.mdTheme);
  const inner = document.createElement('div');
  inner.className = 'preview-body '+App.fontSize;
  inner.innerHTML = App.previewBody.innerHTML;
  wrap.appendChild(inner);
  document.body.appendChild(wrap);

  // Apply a style so the clone uses the theme properly
  wrap.style.backgroundColor = getComputedStyle(App.previewBody).backgroundColor||'#ffffff';
  wrap.style.color = getComputedStyle(App.previewBody).color||'#000';
  inner.style.maxWidth = 'none';
  inner.style.margin = '0';
  inner.style.padding = '0';

  // Remove copy buttons and badges from clone
  wrap.querySelectorAll('.code-copy-btn,.code-lang-badge').forEach(el=>el.remove());

  // Wait for fonts/layout
  await new Promise(r=>setTimeout(r,200));

  // DIAGNOSTIC: exportPNG/exportPDF rasterize the ENTIRE document as one
  // flat canvas sized scrollWidth × scrollHeight × scale, with no upper
  // bound. For a long real document this can balloon into an enormous
  // pixel count (most browsers cap canvases around 16384px per side or
  // ~268M total pixels) — independent of how much syntax-highlighting
  // markup is in it. Logging this lets us see the actual numbers instead
  // of guessing, and the automatic scale-down below stops an oversized
  // request from ever being attempted in the first place.
  const rawW = wrap.scrollWidth, rawH = wrap.scrollHeight;
  const MAX_DIMENSION = 16000;      // stay under common browser canvas limits
  const MAX_TOTAL_PIXELS = 60000000; // ~60MP safety ceiling well under the ~268MP hard cap
  let effectiveScale = scale;
  if (rawH * effectiveScale > MAX_DIMENSION) {
    effectiveScale = Math.max(1, MAX_DIMENSION / rawH);
  }
  if (rawW * rawH * effectiveScale * effectiveScale > MAX_TOTAL_PIXELS) {
    effectiveScale = Math.max(1, Math.sqrt(MAX_TOTAL_PIXELS / (rawW * rawH)));
  }
  console.log('[MDForge export] source size', rawW+'x'+rawH,
    'requested scale', scale, 'effective scale', effectiveScale.toFixed(2),
    'output canvas ~', Math.round(rawW*effectiveScale)+'x'+Math.round(rawH*effectiveScale));
  if (effectiveScale < scale) {
    toast('Document is long — reducing export resolution to avoid a huge/slow image');
  }

  let canvas;
  const renderStart = Date.now();
  try {
    canvas = await html2canvas(wrap, {
      scale: effectiveScale,
      useCORS: false,
      allowTaint: true,
      backgroundColor: getComputedStyle(App.previewBody).backgroundColor || '#ffffff',
      logging: false,
      width: rawW,
      height: rawH,
      windowWidth: rawW,
      // Syntax-highlighted code blocks (especially HTML/CSS, now that
      // highlighting actually works instead of silently failing) can emit
      // thousands of small <span> nodes. html2canvas's default renderer
      // walks the DOM and resolves computed style node-by-node, which is
      // synchronous and scales badly with node count — on span-heavy
      // documents this can block the main thread long enough that the tab
      // looks frozen. foreignObjectRendering serializes the DOM into an SVG
      // <foreignObject> and lets the browser's own (fast, native) renderer
      // draw it instead, which sidesteps that per-node cost entirely.
      // CAVEAT: this path can occasionally return a tainted canvas that
      // fails silently on export — callers fall back to useForeignObject:false
      // (slower, but reliable) if that happens.
      foreignObjectRendering: useForeignObject,
    });
  } finally {
    console.log('[MDForge export] html2canvas render took', (Date.now()-renderStart)+'ms');
    document.body.removeChild(wrap);
  }
  return canvas;
}

// ── EXPORT PNG ────────────────────────────────────────────
async function exportPNG(){
  if(!App.editor.value.trim()){ toast('Nothing to export'); return; }
  showLoading('Rendering PNG…');
  try {
    // NOTE: foreignObjectRendering was tried here as a speed optimization,
    // but it produced a technically-valid-but-blank PNG on this content —
    // that's a silent correctness failure, not a thrown error, so the
    // retry-on-catch pattern that worked for tainted-canvas cases can't
    // detect it. The actual slowness this app was hitting came from an
    // unbounded canvas size (see the scale cap in buildExportCanvas), which
    // is now fixed independently of renderer choice, so we stick with
    // html2canvas's default, thoroughly-tested renderer here.
    const blob = await renderCanvasToBlob(await buildExportCanvas(2, false));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=(App.filename||'document')+'.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    hideLoading();
    toast('PNG exported');
  } catch(e){
    hideLoading();
    toast('Export failed: '+e.message);
    console.error('[MDForge export] PNG export failed:', e);
  }
}

// Wraps canvas.toBlob() in a Promise so failures (including a tainted
// canvas returning null) are actually catchable — the raw callback form
// used previously let errors escape silently since callbacks aren't part
// of an awaited chain.
function renderCanvasToBlob(canvas){
  console.log('[MDForge export] canvas ready, encoding PNG…');
  const blobStart = Date.now();
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => {
      if (!b) { reject(new Error('canvas.toBlob returned null — the canvas is likely tainted or too large for this browser to encode')); return; }
      console.log('[MDForge export] PNG encoded ('+b.size+' bytes) in', (Date.now()-blobStart)+'ms');
      resolve(b);
    }, 'image/png');
  });
}

// ── EXPORT PDF ────────────────────────────────────────────
async function exportPDF(){
  if(!App.editor.value.trim()){ toast('Nothing to export'); return; }
  showLoading('Rendering PDF…');
  try {
    const canvas = await buildExportCanvas(1.5, false);
    await PDFWriter.generate(canvas, (App.filename||'document')+'.pdf');
    hideLoading();
    toast('PDF exported');
  } catch(e){
    hideLoading();
    toast('Export failed: '+e.message);
    console.error(e);
  }
}

// ── LOADING ───────────────────────────────────────────────
function showLoading(msg='Exporting…'){
  document.getElementById('loading-text').textContent=msg;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading(){
  document.getElementById('loading-overlay').classList.remove('show');
}

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── STATUS MSG ────────────────────────────────────────────
function setStatus(msg, type=''){
  const el=document.getElementById('status-msg');
  el.textContent=msg; el.className=type;
}

// ── SPLIT PANE RESIZER ────────────────────────────────────
function initResizer(){
  const gutter = document.getElementById('gutter');
  const container = document.getElementById('split-container');
  const editorPane = document.getElementById('editor-pane');
  const previewPane = document.getElementById('preview-pane');
  let dragging = false;
  let startX = 0;
  let startW = 0;

  gutter.addEventListener('mousedown', e=>{
    dragging=true;
    startX=e.clientX;
    startW=editorPane.getBoundingClientRect().width;
    gutter.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const totalW = container.getBoundingClientRect().width;
    const gutterW = 5;
    const newW = Math.max(200, Math.min(totalW-200-gutterW, startW+(e.clientX-startX)));
    editorPane.style.flex='none';
    editorPane.style.width=newW+'px';
    previewPane.style.flex='1';
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging=false;
    gutter.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
  });
}

// ── FULLSCREEN ────────────────────────────────────────────
function toggleFullscreen(){
  const pane = document.getElementById('preview-pane');
  App.isFullscreen = !App.isFullscreen;
  pane.classList.toggle('fullscreen', App.isFullscreen);
  document.getElementById('btn-fullscreen').innerHTML = App.isFullscreen
    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>'
    : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
  if(!App.isFullscreen){
    document.getElementById('preview-pane').style.position='';
  }
}

// ── MOBILE TABS ───────────────────────────────────────────
function initMobileTabs(){
  const tabs = document.querySelectorAll('.tab-btn');
  const editorPane = document.getElementById('editor-pane');
  const previewPane = document.getElementById('preview-pane');
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.getAttribute('data-tab');
      if(target==='editor'){
        editorPane.classList.remove('hidden-mobile');
        previewPane.classList.add('hidden-mobile');
        document.getElementById('sel-theme-mobile').style.display='none';
      } else {
        editorPane.classList.add('hidden-mobile');
        previewPane.classList.remove('hidden-mobile');
        document.getElementById('sel-theme-mobile').style.display='';
      }
    });
  });
  // Show theme selector in preview header on mobile
  if(window.innerWidth<=768){
    document.getElementById('sel-theme-mobile').style.display='none';
    previewPane.classList.add('hidden-mobile');
  }
}

// ── DRAG & DROP ───────────────────────────────────────────
function initDragDrop(){
  document.addEventListener('dragover', e=>{ e.preventDefault(); document.body.classList.add('drag-over'); });
  document.addEventListener('dragleave', e=>{ if(!e.relatedTarget) document.body.classList.remove('drag-over'); });
  document.addEventListener('drop', e=>{
    e.preventDefault();
    document.body.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if(file) openFile(file);
  });
}

// ── LOCAL STORAGE ─────────────────────────────────────────
function saveToStorage(){
  try {
    localStorage.setItem('mdforge-content', App.editor.value);
  } catch(e) {}
}
function loadFromStorage(){
  try {
    const saved = localStorage.getItem('mdforge-content');
    if(saved !== null) App.editor.value = saved;
    const theme = localStorage.getItem('mdforge-theme')||'github';
    const dark = localStorage.getItem('mdforge-dark')==='1';
    const fs = localStorage.getItem('mdforge-fs')||'fs-md';
    setPreviewTheme(theme);
    setAppDark(dark);
    setFontSize(fs);
    document.getElementById('sel-fontsize').value=fs;
  } catch(e) {}
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────
document.addEventListener('keydown', e=>{
  const ctrl = e.ctrlKey||e.metaKey;
  if(ctrl && e.key==='o'){ e.preventDefault(); document.getElementById('file-input').click(); }
  if(ctrl && e.key==='s'){ e.preventDefault(); saveMarkdown(); }
  if(ctrl && e.key==='e'){ e.preventDefault(); exportPNG(); }
  if(ctrl && e.key==='p'){ e.preventDefault(); exportPDF(); }
  if(ctrl && e.key==='d'){ e.preventDefault(); setAppDark(!App.appDark); }
  if(e.key==='Escape' && App.isFullscreen){ toggleFullscreen(); }
  if(e.key==='Escape' && document.getElementById('carousel-modal-overlay').style.display==='flex'){ closeCarouselModal(); }
  // Tab indent in editor
  if(e.key==='Tab' && document.activeElement===document.getElementById('editor')){
    e.preventDefault();
    const ed = document.getElementById('editor');
    const start = ed.selectionStart, end = ed.selectionEnd;
    ed.value = ed.value.slice(0,start)+'  '+ed.value.slice(end);
    ed.selectionStart = ed.selectionEnd = start+2;
  }
});

// ── INSTAGRAM CAROUSEL: STATE ─────────────────────────────
const Carousel = {
  bg: 'default',
  handle: '',
  filenamePrefix: 'carousel',
  // Internal layout constants (must match .carousel-slide CSS box model)
  SLIDE_SIZE: 1080,
  PAD: 88,        // horizontal padding (px, matches CSS)
  PAD_TOP: 100,   // vertical padding (px, matches CSS) — content is centered
                  // so usable height is computed from the slide minus 2x this
};

function csUsableHeight(){
  // Reserve a little extra at the bottom for badge/handle/dots so content
  // never visually collides with them.
  return Carousel.SLIDE_SIZE - (Carousel.PAD_TOP * 2) - 40;
}
function csUsableWidth(){
  return Carousel.SLIDE_SIZE - (Carousel.PAD * 2);
}

// Render a single marked.js block token to HTML using the shared renderer.
function csRenderToken(token){
  // marked.parser() needs an array of block tokens and renders them through
  // the currently configured renderer (same one used for the live preview),
  // so code highlighting / task lists stay visually consistent.
  return marked.parser([token]);
}

// Measure the rendered pixel height of arbitrary HTML when laid out inside
// a fixed-width carousel content box, using the real offscreen stage so
// fonts/line-height match the final export exactly.
//
// PERFORMANCE NOTE: reading `offsetHeight` forces the browser to run a
// synchronous layout pass. csMeasureHeight() used to be called in a tight
// per-word / per-line loop (appendChild + read + removeChild every single
// time), which for a long paragraph or code block meant hundreds or
// thousands of forced reflows — this was the cause of exports "taking
// forever". csMeasureProbe() below creates ONE offscreen element that a
// splitting loop can reuse across many measurements (just rewriting
// innerHTML each time), and callers should pair it with a binary search
// instead of a linear scan so a block that needs splitting costs O(log n)
// reflows instead of O(n). csMeasureHeight() remains as a convenience
// one-shot wrapper for callers that only need a single measurement.
function csMeasureProbe(){
  const stage = document.getElementById('carousel-stage');
  const probe = document.createElement('div');
  probe.className = 'carousel-slide-content';
  probe.style.position = 'absolute';
  probe.style.visibility = 'hidden';
  probe.style.width = csUsableWidth()+'px';
  stage.appendChild(probe);
  return {
    measure(html){ probe.innerHTML = html; return probe.offsetHeight; },
    destroy(){ stage.removeChild(probe); }
  };
}
function csMeasureHeight(html){
  const probe = csMeasureProbe();
  const h = probe.measure(html);
  probe.destroy();
  return h;
}

// Binary search for the largest prefix (start..end] of `items` whose
// rendered html (built via `build`) fits within maxH. Runs O(log n)
// measurements instead of O(n), which is the difference between ~10
// forced reflows and several thousand for a long block.
function csBinarySearchFit(items, start, maxH, build, probe){
  let lo = start+1, hi = items.length, best = start+1;
  while(lo <= hi){
    const mid = (lo+hi) >> 1;
    const h = probe.measure(build(items.slice(start, mid)));
    if(h <= maxH){ best = mid; lo = mid+1; }
    else { hi = mid-1; }
  }
  return best;
}

// Split an oversized single token's HTML into height-bounded HTML chunks.
// Used as a last resort when one block (e.g. a huge code block or a very
// long paragraph) alone exceeds a full slide, so content is never dropped.
function csSplitOversizedHtml(html, maxH){
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  const root = wrapper.firstElementChild;
  if(!root) return [html];

  // Special-case <pre><code> blocks: split by line so highlighting spans
  // stay intact within each chunk (cuts on the raw text content, re-wrapped
  // in a fresh <pre><code> per chunk — formatting/highlighting is lost only
  // for the spillover chunks' span boundaries, but content is preserved).
  const codeEl = root.querySelector ? root.querySelector('pre code') : null;
  if(codeEl && root.tagName !== 'UL' && root.tagName !== 'OL'){
    const lines = codeEl.textContent.split('\n');
    const buildCode = arr => '<div class="code-block-wrap"><pre><code>'+
      arr.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+
      '</code></pre></div>';
    const chunks = [];
    const probe = csMeasureProbe();
    let start = 0;
    while(start < lines.length){
      const end = csBinarySearchFit(lines, start, maxH, buildCode, probe);
      chunks.push(buildCode(lines.slice(start, end)));
      start = end;
    }
    probe.destroy();
    return chunks.length ? chunks : [html];
  }

  // Generic fallback: split by word boundaries until each chunk fits.
  const words = (root.textContent||'').split(/\s+/).filter(Boolean);
  if(!words.length) return [html];
  const tag = /^H[1-3]$/.test(root.tagName) ? root.tagName.toLowerCase() : 'p';
  const buildWords = arr => '<'+tag+'>'+arr.join(' ')+'</'+tag+'>';
  const chunks = [];
  const probe = csMeasureProbe();
  let start = 0;
  while(start < words.length){
    const end = csBinarySearchFit(words, start, maxH, buildWords, probe);
    chunks.push(buildWords(words.slice(start, end)));
    start = end;
  }
  probe.destroy();
  return chunks.length ? chunks : [html];
}

// Walk the markdown's block tokens and greedily pack them into slides that
// fit the usable content height, splitting any single oversized block
// across multiple slides as a fallback so nothing is ever silently dropped.
function csPaginate(markdown){
  const tokens = marked.lexer(markdown);
  const maxH = csUsableHeight();
  const slides = [];
  let curHtml = '';
  let curH = 0;
  // One probe reused for the whole pass instead of appendChild/removeChild
  // per measurement — cuts DOM mutation overhead for documents with many
  // blocks (headings, paragraphs, list items, code blocks, etc).
  const probe = csMeasureProbe();

  function flush(){
    if(curHtml.trim()){ slides.push(curHtml); }
    curHtml = ''; curH = 0;
  }

  for(const token of tokens){
    if(token.type === 'space') continue;
    const html = csRenderToken(token);
    if(!html || !html.trim()) continue;
    const h = probe.measure(curHtml + html);

    if(h <= maxH){
      curHtml += html;
      curH = h;
      continue;
    }
    // Doesn't fit appended to current slide.
    const aloneH = probe.measure(html);
    if(aloneH <= maxH){
      // Fits on its own slide — flush current, start fresh with this token.
      flush();
      curHtml = html;
      curH = aloneH;
      continue;
    }
    // Single token is bigger than a whole slide — split it.
    flush();
    const parts = csSplitOversizedHtml(html, maxH);
    for(const part of parts){
      const partH = probe.measure(part);
      if(partH <= maxH){
        flush();
        curHtml = part;
        curH = partH;
      } else {
        // Still too big (rare) — place on its own slide anyway rather than
        // dropping content; html2canvas will just clip the overflow.
        flush();
        slides.push(part);
      }
    }
  }
  flush();
  probe.destroy();
  return slides.length ? slides : ['<p>(empty document)</p>'];
}

// Render one slide's HTML into the offscreen stage, capture via html2canvas,
// and return a PNG Blob.
async function csRenderSlideToPng(html, index, total){
  const stage = document.getElementById('carousel-stage');
  const slide = document.createElement('div');
  slide.className = 'carousel-slide';
  slide.setAttribute('data-cs-bg', Carousel.bg);

  const content = document.createElement('div');
  content.className = 'carousel-slide-content';
  content.innerHTML = html;
  slide.appendChild(content);

  const badge = document.createElement('div');
  badge.className = 'carousel-badge';
  badge.textContent = (index+1)+' / '+total;
  slide.appendChild(badge);

  if(Carousel.handle){
    const handle = document.createElement('div');
    handle.className = 'carousel-handle';
    handle.textContent = Carousel.handle;
    slide.appendChild(handle);
  }

  const dots = document.createElement('div');
  dots.className = 'carousel-progress-dots';
  for(let i=0;i<Math.min(total,12);i++){
    const dot = document.createElement('span');
    if(i===index) dot.classList.add('active');
    dots.appendChild(dot);
  }
  slide.appendChild(dots);

  stage.appendChild(slide);
  await new Promise(r=>setTimeout(r, 60)); // let layout/fonts settle

  let canvas;
  try {
    canvas = await html2canvas(slide, {
      width: Carousel.SLIDE_SIZE,
      height: Carousel.SLIDE_SIZE,
      scale: 1,
      useCORS: false,
      allowTaint: true,
      logging: false,
      foreignObjectRendering: false,
    });
  } finally {
    stage.removeChild(slide);
  }

  return await new Promise(resolve=>canvas.toBlob(resolve, 'image/png'));
}

async function csGenerateZip(){
  const md = App.editor.value;
  if(!md.trim()){ toast('Nothing to export'); return; }

  const progressWrap = document.getElementById('cs-progress-wrap');
  const progressLabel = document.getElementById('cs-progress-label');
  const progressFill = document.getElementById('cs-progress-fill');
  const genBtn = document.getElementById('carousel-generate-btn');

  Carousel.handle = document.getElementById('cs-handle').value.trim();
  Carousel.filenamePrefix = document.getElementById('cs-filename').value.trim() || 'carousel';

  genBtn.disabled = true;
  progressWrap.classList.add('show');
  progressLabel.textContent = 'Paginating content…';
  progressFill.style.width = '4%';

  try {
    const slides = csPaginate(md);
    const total = slides.length;
    const zip = new JSZip();
    const pad = String(total).length;

    for(let i=0;i<total;i++){
      progressLabel.textContent = 'Rendering slide '+(i+1)+' of '+total+'…';
      progressFill.style.width = Math.round(((i+1)/total)*90 + 4)+'%';
      const blob = await csRenderSlideToPng(slides[i], i, total);
      const num = String(i+1).padStart(pad, '0');
      zip.file(Carousel.filenamePrefix+'-'+num+'.png', blob);
    }

    progressLabel.textContent = 'Zipping…';
    progressFill.style.width = '97%';
    const zipBlob = await zip.generateAsync({type:'blob'});
    progressFill.style.width = '100%';

    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = Carousel.filenamePrefix+'.zip';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);

    toast(total+' slide'+(total===1?'':'s')+' exported as ZIP');
    closeCarouselModal();
  } catch(e){
    toast('Carousel export failed: '+e.message);
    console.error(e);
  } finally {
    genBtn.disabled = false;
    progressWrap.classList.remove('show');
    progressFill.style.width = '0%';
  }
}

function openCarouselModal(){
  if(!App.editor.value.trim()){ toast('Nothing to export'); return; }
  document.getElementById('cs-filename').value = App.filename || 'carousel';
  document.getElementById('carousel-modal-overlay').style.display = 'flex';
}
function closeCarouselModal(){
  document.getElementById('carousel-modal-overlay').style.display = 'none';
}

function initCarouselUI(){
  document.getElementById('btn-export-carousel').addEventListener('click', openCarouselModal);
  document.getElementById('carousel-modal-close').addEventListener('click', closeCarouselModal);
  document.getElementById('carousel-cancel-btn').addEventListener('click', closeCarouselModal);
  document.getElementById('carousel-generate-btn').addEventListener('click', csGenerateZip);
  document.getElementById('carousel-modal-overlay').addEventListener('click', e=>{
    if(e.target.id === 'carousel-modal-overlay') closeCarouselModal();
  });
  document.querySelectorAll('.cs-swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('.cs-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      Carousel.bg = sw.getAttribute('data-bg');
    });
  });
}

// ── WIRE UP EVENTS ────────────────────────────────────────
function init(){
  loadFromStorage();
  initResizer();
  initMobileTabs();
  initDragDrop();
  initCarouselUI();
  renderPreview();

  // Editor input
  document.getElementById('editor').addEventListener('input', scheduleRender);
  document.getElementById('editor').addEventListener('paste', ()=>{ setTimeout(renderPreview, 50); });

  // Toolbar buttons
  document.getElementById('file-input').addEventListener('change', e=>openFile(e.target.files[0]));
  document.getElementById('btn-save').addEventListener('click', saveMarkdown);
  document.getElementById('btn-clear').addEventListener('click', ()=>{
    if(!App.editor.value||confirm('Clear the editor?')){
      App.editor.value=''; App.filename='document';
      document.getElementById('pane-filename').textContent='';
      renderPreview(); toast('Editor cleared');
    }
  });
  document.getElementById('btn-export-png').addEventListener('click', exportPNG);
  document.getElementById('btn-export-pdf').addEventListener('click', exportPDF);
  document.getElementById('btn-copy-html').addEventListener('click', copyHTML);
  document.getElementById('btn-dark').addEventListener('click', ()=>setAppDark(!App.appDark));
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

  // Theme selectors (both desktop + mobile)
  ['sel-theme','sel-theme-mobile'].forEach(id=>{
    document.getElementById(id).addEventListener('change', e=>setPreviewTheme(e.target.value));
  });
  document.getElementById('sel-fontsize').addEventListener('change', e=>setFontSize(e.target.value));

  // Update status
  setStatus('Ready');
}

document.addEventListener('DOMContentLoaded', init);
</script>
